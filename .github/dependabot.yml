version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"
      # interval: "cron"
      # cronjob: "0 6 1 */3 *"
    commit-message:
      prefix: "🤖 dependabot chore:"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "infrastructure"
